[build-system]
requires      = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project.scripts]
denoise-tmppca = "tmppca.denoise_tmppca_cli:main"

[project]
name            = "tmppca"
version         = "0.1"
description     = "Tensor MP-PCA denoiser for MRI data (C++/Eigen backend)"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "nibabel>=5",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages   = ["tmppca"]